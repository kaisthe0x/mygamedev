# Python tooling config for the dev/build scripts (tools/, vfx/script/). Godot's
# GDScript is formatted separately by gdformat -- see .pre-commit-config.yaml.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E), isort(I), pyupgrade(UP), flake8-bugbear(B).
select = ["E", "F", "I", "UP", "B"]
